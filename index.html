<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annotation Workbench</title><style>body{font:16px system-ui;margin:auto;max-width:850px;padding:36px;background:#f7f8fb;color:#172033}h1{margin-bottom:4px}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 4px 20px #18263a12;margin:20px 0}button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin:4px}.tag{background:#e8eefc;color:#2347a4;padding:5px 9px;border-radius:99px;margin:3px;display:inline-block}textarea{width:100%;height:85px;font:inherit;padding:10px;box-sizing:border-box}.muted{color:#667085}</style><body><h1>Annotation Workbench</h1><p class="muted">一个浏览器内运行的中文文本标注练习工具。</p><main class="card"><p id="progress"></p><h2 id="text"></h2><p>选择最合适的意图标签：</p><div id="choices"></div><p id="result" class="muted"></p></main><section class="card"><h2>导出结果</h2><p id="summary">尚未完成标注。</p><button onclick="download()">下载 JSON</button></section><script>const items=[['退款为什么还没到账','售后与退款'],['App 打不开，一直闪退','技术故障'],['怎样修改手机号','账号与登录'],['订单地址填错了','订单修改'],['重复扣了两次会员费','支付与账单']];const labels=['售后与退款','技术故障','账号与登录','订单修改','支付与账单'];let i=0,answers=[];function draw(){if(i===items.length){document.querySelector('main').innerHTML='<h2>标注完成</h2><p>已完成 '+answers.length+' 条样本。</p>';document.querySelector('#summary').textContent='共标注 '+answers.length+' 条，可下载 JSON 文件。';return}progress.textContent=`样本 ${i+1} / ${items.length}`;text.textContent=items[i][0];choices.innerHTML=labels.map(x=>`<button onclick="pick('${x}')">${x}</button>`).join('');result.textContent=''}function pick(label){answers.push({id:i+1,text:items[i][0],label,expected:items[i][1],correct:label===items[i][1]});i++;draw()}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(answers,null,2)],{type:'application/json'}));a.download='annotations.json';a.click()}draw()</script></body></html>
